services:
  - type: web
    name: astra-stardust
    runtime: node
    region: singapore
    plan: free
    buildCommand: node --check server/server.js
    startCommand: node server/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STEP_API_KEY
        sync: false
      - key: RATE_PER_DAY
        value: "20"
      - key: MAX_CONCURRENT_AI
        value: "6"
